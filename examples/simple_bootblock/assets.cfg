# Asset list for the demo disk.
# Format: asset NAME "path" [type=part|music|gfx] [mem=any|chip]
# NAME must be 4 characters or fewer. Attributes are optional and
# default to type=part, mem=any.

asset RESI "resident"	type=part mem=chip
asset PT00 "part0"	type=part

# music and graphics must be reachable by the blitter/Paula, so chip mem
asset MUS1 "bassing.modified.mod"		type=music mem=chip
asset GFX1 "rogal.under_the_bridge.scaled.png"	type=gfx   mem=chip
