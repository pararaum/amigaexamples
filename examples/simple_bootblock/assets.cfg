# Asset list for the demo disk.
# Format: asset NAME "path" [mem=any|chip|<address>]
# NAME must be 4 characters or fewer. Attributes are optional and
# default to type=part, mem=any.

asset RESI "resident"		mem=6000
asset PT00 "part0.c20000.bin"	mem=c20000 alloc=no

# music and graphics must be reachable by the blitter/Paula, so chip mem
asset MUS1 "bassing.modified.mod"			mem=chip
asset GFX1 "rogal.under_the_bridge.scaled.5bitplane.bin" mem=chip
asset GFX2 "dream_08_wip_268x256_jok.5bitplane.bin"	mem=chip
